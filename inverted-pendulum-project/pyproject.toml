[project]
name = "inverted-pendulum-project"
version = "0.1.0"
description = "Inverted pendulum simulation and modeling project with headless FreeCAD integration via subprocess"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "cadquery>=2.0.0,<3",           # Phase 6: Parametric CAD generation
    "trimesh>=4.0.0,<5",            # Phase 6: Mesh processing and repair
]
